name: Model quality

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: model-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Train, test and build the report
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: python -m playwright install --with-deps chromium

      - name: Train candidate models (fails on bad data)
        run: python -m fraudmodel.train

      - name: Run data, model, API and dashboard tests
        run: python -m pytest

      - name: Build the quality report
        if: always()
        run: python report/build_site.py

      - name: Add results to the run summary
        if: always()
        run: |
          python - <<'EOF' >> "$GITHUB_STEP_SUMMARY"
          import json
          s = json.load(open("artifacts/metrics.json"))
          print(f"### Champion: {s['champion']} (version {s['model_version']})\n")
          print("| Model | PR-AUC | Precision | Recall | FPR | Quality bar |\n| --- | ---: | ---: | ---: | ---: | --- |")
          for n, m in s["models"].items():
              x = m["metrics"]
              print(f"| {n} | {x['pr_auc']:.3f} | {x['precision']:.1%} | {x['recall']:.1%} | {x['false_positive_rate']:.2%} | {'PASS' if m['passes_quality_bar'] else 'FAIL'} |")
          EOF

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: model-and-report
          path: |
            artifacts/
            site/
            reports/
          retention-days: 14

      - name: Upload report for GitHub Pages
        if: always() && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    name: Publish report to GitHub Pages
    needs: test
    if: always() && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
